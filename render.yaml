services:
  - type: web
    name: resumen-comercial-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OLLAMA_API_KEY
        sync: false
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: KAFKA_ENABLED
        value: "true"
      - key: CLIENTES_URL
        sync: false
      - key: VEHICULOS_URL
        sync: false
